# Keeps README counts, cards, charts and alphabetical order up to date.
# Runs after any change to README.md (or the script) lands on main,
# and can also be started by hand from the Actions tab.
name: Update README

on:
  push:
    branches: [main]
    paths: ["README.md", "scripts/update_readme.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sort tables, refresh counts and redraw graphics
        run: python scripts/update_readme.py

      - name: Commit changes, if any
        run: |
          if [ -n "$(git status --porcelain README.md assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add README.md assets
            git commit -m "docs: refresh README counts and charts"
            git push
          else
            echo "README already up to date."
          fi
